<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Illustration of a chocolate brownie">
  <!-- PLACEHOLDER ARTWORK: replace with real DGAP product photography from /admin -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#fff8f0"/>
      <stop offset="1" stop-color="#ead8c5"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2a1b"/>
      <stop offset="0.55" stop-color="#2b160f"/>
      <stop offset="1" stop-color="#1a0d09"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1d12"/>
      <stop offset="1" stop-color="#160b08"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="610" rx="260" ry="46" fill="#2b160f" opacity="0.28" filter="url(#blur)"/>
  <!-- side faces -->
  <path d="M150 380 L400 470 L400 610 L150 520 Z" fill="url(#side)"/>
  <path d="M650 380 L400 470 L400 610 L650 520 Z" fill="#1f0f0a"/>
  <path d="M400 470 L400 610" stroke="#4a2a1b" stroke-width="2" opacity="0.5"/>
  <!-- layered fudgy edge -->
  <path d="M150 440 L400 530 L650 440" fill="none" stroke="#5a331f" stroke-width="3" opacity="0.55"/>
  <!-- top face -->
  <path d="M150 380 L400 290 L650 380 L400 470 Z" fill="url(#top)" stroke="#5a331f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M150 380 L400 290 L650 380 L400 470 Z" fill="url(#sheen)"/>
  <!-- crackle -->
  <g fill="none" stroke="#c89452" stroke-linecap="round" opacity="0.55">
    <path d="M300 360 L350 372 L378 355 L420 380" stroke-width="2.5"/>
    <path d="M470 345 L520 362 L548 350" stroke-width="2"/>
    <path d="M400 420 L440 410 L480 428" stroke-width="2"/>
    <path d="M250 392 L300 405" stroke-width="2"/>
  </g>
  <!-- chocolate chunks -->
  <g fill="#1a0d09" stroke="#5a331f" stroke-width="2">
    <path d="M330 330 l38 -12 l18 22 l-38 12 z"/>
    <path d="M500 392 l36 -10 l16 22 l-36 10 z"/>
    <path d="M410 372 l30 -9 l14 17 l-30 9 z"/>
  </g>
  <!-- sea-salt flecks -->
  <g fill="#fff8f0" opacity="0.85">
    <circle cx="372" cy="350" r="3"/><circle cx="455" cy="388" r="2.5"/><circle cx="288" cy="380" r="2.5"/>
    <circle cx="540" cy="372" r="3"/><circle cx="410" cy="440" r="2.5"/><circle cx="350" cy="410" r="2"/>
  </g>
</svg>
